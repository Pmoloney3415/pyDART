# Generic randomized 60-beam facility baseline.
# Port angles were sampled uniformly on the sphere with xorshift32 seed 20260810.

[simulation]
index = 60
output_directory = "results/simulations/"
save_deposition_data = true
save_metrics = true
plot_data = true
plot_dpi = 200
surface_quadrature_order = 1
visibility_smoothing_epsilon = 0.00

[metrics]
l_max = 20

[target]
radius = 5.0e-4
n_polar = 128
n_azimuthal = 256
numerical_origin_radius_factor = 10.0

[laser]
n_beams = 60
total_incident_power = 25.0e12

# Spherical locations are ordered (r, phi, theta). Each beam has one sixtieth
# of the facility power capacity and initially operates at full power.

[[beam]]
name = "beam_1"
origin_coordinate_system = "spherical"
pointing_coordinate_system = "cartesian"
origin = [1.0, -2.447220419, 1.526049315]
pointing = [0.0, 0.0, 0.0]
maximum_power_fraction = 0.016666666666666666
power_fraction_of_maximum = 1.0
frequency = 5.361e15
[beam.spot]
shape = "circular"
width_x = 200e-6
width_y = 200e-6
supergaussian_index = 2.0
rotation = 0.0


# Randomized six-beam facility baseline.
# Port angles were generated uniformly on the sphere with seed 20260816.

[simulation]
index = 6
output_directory = "results/simulations/"
save_deposition_data = true
save_metrics = true
plot_data = true
plot_dpi = 200
surface_quadrature_order = 1
visibility_smoothing_epsilon = 0.05

[metrics]
l_max = 12

[target]
radius = 5.0e-4
n_polar = 64
n_azimuthal = 128
numerical_origin_radius_factor = 10.0

[laser]
n_beams = 6
total_incident_power = 20.0e12

# Spherical locations are ordered (r, phi, theta). Each beam has one sixth
# of the facility power capacity and initially operates at full power.

[[beam]]
name = "beam_1"
origin_coordinate_system = "spherical"
pointing_coordinate_system = "cartesian"
origin = [1.0, 2.313776073, 1.632898884]
pointing = [0.0, 0.0, 0.0]
maximum_power_fraction = 0.16666666666666666
power_fraction_of_maximum = 1.0
frequency = 5.361e15
[beam.spot]
shape = "circular"
width_x = 200e-6
width_y = 200e-6
supergaussian_index = 2.0
rotation = 0.0


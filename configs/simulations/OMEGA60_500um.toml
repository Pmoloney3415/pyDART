# ============================================================
# pyDART simulation input deck
# ============================================================

[simulation]
index = 1
# Note that the simulation will create a 'simulation_{index}/'...
# ...folder within the output directory, where results files...
# ...will be saved.
output_directory = "results/simulations/"

save_deposition_data = true
save_metrics = true
plot_data = true
plot_dpi = 200
surface_quadrature_order = 1
visibility_smoothing_epsilon = 0.05

[metrics]
l_max = 20


# ============================================================
# Target / spherical surface mesh
# ============================================================

[target]
radius = 5.0e-4          # m
n_polar = 128            # theta cells
n_azimuthal = 256        # phi cells
numerical_origin_radius_factor = 10.0


# ============================================================
# Laser system
# ============================================================

[laser]
n_beams = 60
total_incident_power = 25.0e12     # W


# ============================================================
# Individual beams
#
# Beam origin and pointing locations are given in the coordinate
# system specified by `origin_coordinate_system` and
# `pointing_coordinate_system` separately. Spherical coordinates are
# ordered (r, phi, theta), with angles in radians.
# `maximum_power_fraction` allocates facility capacity and must sum to 1.
# `power_fraction_of_maximum` sets the beam operating fraction in [0, 1].
#
# ============================================================

[[beam]]
name = "beam_17"
origin_coordinate_system = "spherical"
pointing_coordinate_system = "cartesian"
origin =   [3.3, -0.314159265, 0.373849526]  # r [m], phi [rad], theta [rad]
pointing = [0.0, 0.0,         0.0]          # x, y, z [m]
maximum_power_fraction = 0.016666666666666666
power_fraction_of_maximum = 1.0
frequency = 5.361e15                        # rad/s
[beam.spot]
shape = "circular"
width_x = 3.58e-4                           # m
width_y = 3.58e-4                           # m
supergaussian_index = 5.2
rotation = 0.0

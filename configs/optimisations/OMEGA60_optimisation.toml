[optimisation]
index = 1
solver = "scipy_lbfgsb"
simulation_config = "../simulations/OMEGA60_500um.toml"
output_directory = "../../results/optimisations"
maximum_iterations = 5000
device_iteration_chunk_size = 10
objective_relative_tolerance = 1.0e-9
projected_gradient_tolerance = 1.0e-6
maximum_wall_time_seconds = 3600
checkpoint_interval = 500
history_plot_interval = 500
save_best_simulation = true
save_simulation_plots = false
archive_previous_best_simulations = false

[optimisation.restarts]
number = 8
# Preserve the structured reference as restart 1; the other seven are random.
include_base_design = false
random_seed = 20260812

[variables]
# Put beam names here to hold all their variables fixed, for example
# frozen_beams = ["beam_17", "beam_22"]
frozen_beams = []

# All supported beam parameters are free, with spot ellipticity and rotation
# disabled so every optimized spot remains circular.
[variables.power]
enabled = false
minimum_fraction_of_maximum = 0.0
maximum_fraction_of_maximum = 1.0

[variables.origin]
enabled = true
constraint = "unconstrained"

[variables.pointing]
enabled = false
constraint = "bounded"
maximum_angular_displacement_degrees = 15.0

[variables.spot]
width_enabled = true
share_width_across_beams = true
force_circular = true
minimum_width_x = 100e-6
maximum_width_x = 600e-6
minimum_width_y = 100e-6
maximum_width_y = 600e-6
rotation_enabled = false
minimum_rotation_degrees = 0.0
maximum_rotation_degrees = 180.0
supergaussian_index_enabled = true
share_supergaussian_index_across_beams = true
minimum_supergaussian_index = 2.0
maximum_supergaussian_index = 8.0

[objective]
deposition_log_weight = 20.0
deposition_log_epsilon = 1.0e-8
acceptable_rms_nonuniformity = 0.01
rms_power = 2.0

[optimisation]
index = 5
solver = "scipy_lbfgsb"
simulation_config = "../simulations/six_beam_500um.toml"
output_directory = "../../results/optimisations"
maximum_iterations = 1000
objective_relative_tolerance = 1.0e-9
projected_gradient_tolerance = 1.0e-6
maximum_wall_time_seconds = 3600
checkpoint_interval = 25
history_plot_interval = 25
save_best_simulation = true
save_simulation_plots = false
archive_previous_best_simulations = true

[optimisation.restarts]
number = 4
include_base_design = true
random_seed = 20260809

[variables]
frozen_beams = []

[variables.power]
enabled = true
minimum_fraction_of_maximum = 0.0
maximum_fraction_of_maximum = 1.0

[variables.origin]
enabled = true
constraint = "unconstrained"

[variables.pointing]
enabled = true
constraint = "bounded"
maximum_angular_displacement_degrees = 80.0

[variables.spot]
width_enabled = true
force_circular = false
minimum_width_x = 100e-6
maximum_width_x = 600e-6
minimum_width_y = 100e-6
maximum_width_y = 600e-6
rotation_enabled = true
minimum_rotation_degrees = 0.0
maximum_rotation_degrees = 180.0
supergaussian_index_enabled = true
minimum_supergaussian_index = 1.5
maximum_supergaussian_index = 8.0

[objective]
rms_weight = 1.0
deposited_power_weight = 0.5
mode_weight_option = "decreasing"
l1_mode_weight = 1.0
mode_decrease_power = 0.5

repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: Check Python formatting with Ruff
        entry: uv run ruff format --check src tests examples
        language: system
        files: ^(src|tests|examples)/.*\.py$
        pass_filenames: false

      - id: ruff-lint
        name: Lint Python with Ruff
        entry: uv run ruff check src tests examples
        language: system
        files: ^(src|tests|examples)/.*\.py$
        pass_filenames: false

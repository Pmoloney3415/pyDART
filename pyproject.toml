[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pydart"
version = "0.1.0"
description = "Differentiable illumination ray tracing and beam optimization"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Philip W. Moloney" },
]
keywords = [
    "automatic differentiation",
    "inertial confinement fusion",
    "JAX",
    "laser illumination",
    "ray tracing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "h5py",
    "jax",
    "matplotlib",
    "numpy",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/Pmoloney3415/pyDART"
Repository = "https://github.com/Pmoloney3415/pyDART"
Issues = "https://github.com/Pmoloney3415/pyDART/issues"

[project.scripts]
pydart-simulate = "pydart.cli.simulate:main"
pydart-optimise = "pydart.cli.optimise:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
